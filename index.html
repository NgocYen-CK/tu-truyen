<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f8f6">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tủ truyện">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tủ truyện</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
:root{
  /* Bố cục: một cột chữ hẹp, toàn bộ là chữ Times — không ảnh bìa, không thẻ nổi; chỉ đường kẻ mảnh và một màu mực xanh. */
  --bg:#f8f8f6; --surface:#ffffff; --fg:#1d1d1f; --muted:#6d6c69; --line:#e1e0db;
  --accent:#27466e; --accent-ink:#ffffff; --danger:#a1322a; --wash:#eef1f5;
  --serif:"Times New Roman", Tinos, Times, "Liberation Serif", serif;
  --rs:20px; --rl:1.75; --rw:36em;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121315; --surface:#1a1b1e; --fg:#dedbd4; --muted:#8f8d87; --line:#2c2d31; --accent:#a0badc; --accent-ink:#121315; --danger:#e48a7f; --wash:#1d2129; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#121315; --surface:#1a1b1e; --fg:#dedbd4; --muted:#8f8d87; --line:#2c2d31; --accent:#a0badc; --accent-ink:#121315; --danger:#e48a7f; --wash:#1d2129; color-scheme:dark; }
:root[data-mode="light"]{ --bg:#f8f8f6; --surface:#ffffff; --fg:#1d1d1f; --muted:#6d6c69; --line:#e1e0db; --accent:#27466e; --accent-ink:#ffffff; --danger:#a1322a; --wash:#eef1f5; color-scheme:light; }
:root[data-mode="paper"]{ --bg:#f1e9d8; --surface:#f7f0e2; --fg:#372e22; --muted:#7c6e59; --line:#dacdb5; --accent:#7a4a1e; --accent-ink:#fff8ee; --danger:#9a2e21; --wash:#ebe0ca; color-scheme:light; }
:root[data-mode="dark"]{ --bg:#121315; --surface:#1a1b1e; --fg:#dedbd4; --muted:#8f8d87; --line:#2c2d31; --accent:#a0badc; --accent-ink:#121315; --danger:#e48a7f; --wash:#1d2129; color-scheme:dark; }

html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--serif);font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%;margin:0}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:42rem;margin:0 auto;padding-inline:16px;padding-block:0 72px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{margin:0;font-size:1.65rem;font-weight:400;letter-spacing:.01em}
.top h1 i{color:var(--muted);font-size:.7em}
.top-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;padding:.38em .85em;border-radius:6px;cursor:pointer;line-height:1.3;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.big{padding:.6em 1.1em;font-size:1.05rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:.25em 0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}
.sc{font-variant:small-caps;letter-spacing:.06em;text-transform:lowercase}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}

/* Search */
.search{display:grid;gap:10px;padding-block:16px 4px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:.42em .5em;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:.5em .7em;min-width:0}
textarea.field{resize:vertical;line-height:1.55}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.12em .7em;font-size:.88rem;cursor:pointer;font-style:italic}
.tag[aria-pressed="true"]{background:var(--wash);border-color:var(--accent);color:var(--accent)}
.filters{display:flex;gap:16px;flex-wrap:wrap;padding-block:6px 0;border-bottom:1px solid var(--line)}
.filters button{background:none;border:0;padding:.4em 0;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.filters button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--fg)}

/* Continue strip */
.continue{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.continue div{min-width:0}
.continue b{display:block;font-size:1.15rem;font-weight:700}

/* Shelf */
.shelf{list-style:none;margin:0;padding:0}
.shelf li{border-bottom:1px solid var(--line)}
.row{display:grid;gap:3px;width:100%;text-align:left;background:none;border:0;padding:14px 0;cursor:pointer}
.row:hover .r-t{color:var(--accent)}
.r-t{font-size:1.28rem;font-weight:700;line-height:1.25;text-wrap:balance}
.r-a{font-style:italic;color:var(--muted)}
.r-g{font-size:.88rem;color:var(--muted)}
.r-p{display:flex;align-items:center;gap:10px;font-size:.86rem;color:var(--muted);margin-top:4px}
.bar{flex:0 0 7rem;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{padding:36px 0;color:var(--muted);text-align:center}

/* Story */
.story-head{padding-block:22px 6px;display:grid;gap:6px}
.story-head h1{margin:0;font-size:2rem;line-height:1.15;font-weight:700;text-wrap:balance}
.story-head .by{font-style:italic;color:var(--muted);font-size:1.1rem;margin:0}
.note{white-space:pre-wrap;margin:6px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-block:14px}
.meta-line{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem}
.meta-line .bar{flex:1;max-width:14rem}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:22px;border-bottom:1px solid var(--fg);padding-bottom:6px;flex-wrap:wrap}
.sec h2{margin:0;font-size:1.25rem;font-weight:400}
.toc{list-style:none;margin:0;padding:0;counter-reset:none}
.toc li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.toc .go{flex:1;min-width:0;text-align:left;background:none;border:0;padding:11px 0;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.toc .go .n{color:var(--muted);font-size:.82rem;min-width:2.2em;font-variant-numeric:tabular-nums}
.toc .go .t{overflow-wrap:anywhere}
.toc li.read .go .t{color:var(--muted)}
.toc li.cur .go .t{color:var(--accent);font-weight:700}
.toc .ed{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--accent);cursor:pointer;padding:.2em .7em;font-size:.88rem;flex:none}
.toc .ed:hover{border-color:var(--accent)}

.quick summary::-webkit-details-marker{display:none}
.quick[open] summary{border-bottom-color:var(--line)}
/* Forms */
.form{display:grid;gap:16px;padding-block:20px}
.form label{display:grid;gap:5px}
.form label>span{font-variant:small-caps;letter-spacing:.06em;text-transform:lowercase;color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.preview{border:1px dashed var(--line);border-radius:7px;padding:10px 12px;font-size:.92rem;max-height:14rem;overflow:auto}
.preview ol{margin:.3em 0 0;padding-left:1.4em}
.check{display:flex!important;grid-template-columns:none;align-items:center;gap:8px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.drop{border:1px dashed var(--muted);border-radius:7px;padding:18px;text-align:center;cursor:pointer}
.drop.over{background:var(--wash)}

/* Settings */
.set{padding-block:18px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.set h2{margin:0;font-size:1.25rem;font-weight:400}
.set .line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .btn{min-width:2.4em}
.dev{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.dev div{min-width:0}
.pill{display:inline-block;font-size:.78rem;padding:.05em .55em;border-radius:999px;border:1px solid var(--line);margin-left:6px;vertical-align:1px}
.pill.ok{color:var(--accent);border-color:var(--accent)}
.pill.warn{color:var(--danger);border-color:var(--danger)}
.sample{border-left:2px solid var(--line);padding-left:12px;font-size:var(--rs);line-height:var(--rl);margin:0}

/* Reader */
#reader{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.r-top,.r-bot{position:fixed;left:0;right:0;z-index:21;background:var(--bg);display:flex;align-items:center;gap:8px;padding-inline:12px;transition:transform .22s ease}
.r-top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;border-bottom:1px solid var(--line)}
.r-bot{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding-top:8px;border-top:1px solid var(--line);justify-content:space-between}
#reader.calm .r-top{transform:translateY(-110%)}
#reader.calm .r-bot{transform:translateY(110%)}
.r-top .ttl{flex:1;min-width:0;display:grid;line-height:1.2}
.r-top .ttl b,.r-top .ttl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-top .ttl span{font-size:.82rem;color:var(--muted)}
.ib{background:none;border:0;padding:.35em .55em;cursor:pointer;border-radius:6px;white-space:nowrap}
.ib:hover{background:var(--wash)}
.r-body{max-width:var(--rw);margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 76px) 18px calc(env(safe-area-inset-bottom,0px) + 40px);font-size:var(--rs);line-height:var(--rl)}
.r-body h2{font-size:1.35em;line-height:1.3;font-weight:700;margin:0 0 1.2em;text-align:center;text-wrap:balance}
.r-body .r-kicker{text-align:center;color:var(--muted);font-size:.7em;margin:0 0 .4em;font-variant:small-caps;letter-spacing:.08em}
.r-text p{margin:0 0 .9em;overflow-wrap:break-word}
.r-text.just p{text-align:justify;hyphens:auto}
.r-end{display:block;height:1px}
.sel-btn{position:fixed;z-index:22;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);box-shadow:0 4px 14px color-mix(in srgb,#000 22%,transparent)}
/* Lật trang ngang */
#reader.paged{overflow:hidden}
#reader.paged.calm .r-top,#reader.paged.calm .r-bot{transform:none}
#reader.paged .r-body{position:absolute;left:0;right:0;margin:0 auto;width:min(100%, calc(var(--rw) + 36px));max-width:none;padding:14px 18px 0;overflow:hidden}
#reader.paged .r-cols{transition:transform .25s ease;will-change:transform}
#reader.paged .r-text p{break-inside:auto;orphans:2;widows:2}

.r-pg{font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;flex:1;min-width:0;display:grid;gap:2px}
#r-seek{width:100%;margin:0;accent-color:var(--accent);height:22px;cursor:pointer}
#reader.paged .r-cols{transition:transform .2s ease}

/* Sheets & modal */
.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#000 38%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:40rem;max-height:78vh;overflow:auto;border-radius:12px 12px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;gap:12px;align-content:start}
.sheet h3{margin:0;font-size:1.15rem;font-weight:400}
.sheet .toc li{padding-left:2px}
.modal{align-items:center;padding:16px}
.modal .card{background:var(--surface);border-radius:10px;padding:18px;max-width:26rem;width:100%;display:grid;gap:14px;border:1px solid var(--line)}
.modal .card p{margin:0}
.modal .row2{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:.5em 1em;border-radius:8px;font-size:.95rem;max-width:calc(100% - 32px);text-align:center}

/* Lock */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.lock-box{width:100%;max-width:22rem;display:grid;gap:14px;text-align:center}
.lock-box h1{margin:0;font-size:2.2rem;font-weight:400;letter-spacing:.02em}
.lock-box .rule{width:3rem;height:1px;background:var(--fg);margin:0 auto}
.lock-box .field{text-align:center;font-size:1.25rem;letter-spacing:.12em}
.lock-box .err{color:var(--danger);min-height:1.4em;margin:0;font-size:.95rem}
.lock-box .hint{text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<div id="lock" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>window.__TT_HOSTED = true;</script>
<script src="config.js"></script>
<script>
'use strict';
/* Tủ truyện — thư viện truyện riêng tư, mã hoá, đọc offline, đồng bộ Google Drive */
(function(){
const VERSION = '1.0.0';
const HOSTED = !!window.__TT_HOSTED;
const CFG = window.TU_TRUYEN_CONFIG || {};
const MAMMOTH_URL = HOSTED ? 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js' : 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js';
const SCOPE = 'https://www.googleapis.com/auth/drive.appdata openid email profile';
const LIB_FILE = 'tu-truyen-thu-vien.json', STATE_FILE = 'tu-truyen-trang-thai.json';
const ITER = 210000;

/* ---------- tiện ích ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'd').toLowerCase().trim();
const te = new TextEncoder(), td = new TextDecoder();
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const b64 = buf => { const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
const fmtTime = t => t ? new Date(t).toLocaleString('vi-VN', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'numeric'}) : '—';
const fmtAgo = t => { if (!t) return 'chưa bao giờ'; const m = Math.round((Date.now() - t) / 60000); if (m < 1) return 'vừa xong'; if (m < 60) return m + ' phút trước'; const h = Math.round(m / 60); if (h < 24) return h + ' giờ trước'; return fmtTime(t); };
const LS = {
  get(k, d){ try { const v = localStorage.getItem('tt:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('tt:' + k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem('tt:' + k); } catch {} }
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------- mã hoá ---------- */
const Vault = { key: null, syncKey: null };
async function pbkdf2(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations: iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function aesEnc(key, bytes){ const iv = rand(12); const c = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes); return {iv, c: new Uint8Array(c)}; }
async function aesDec(key, iv, c){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, c)); }
const importAes = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']);
async function sealJSON(key, obj){ const {iv, c} = await aesEnc(key, te.encode(JSON.stringify(obj))); return {iv: b64(iv), c: b64(c)}; }
async function openJSON(key, box){ return JSON.parse(td.decode(await aesDec(key, unb64(box.iv), unb64(box.c)))); }

/* ---------- cơ sở dữ liệu (IndexedDB, mọi bản ghi được mã hoá) ---------- */
const STORES = {stories:'id', chapters:'id', texts:'id', progress:'storyId', kv:'k'};
const DB = {
  db: null, mem: Object.fromEntries(Object.keys(STORES).map(k => [k, new Map()])),
  async open(){
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('tu-truyen', 1);
        r.onupgradeneeded = () => { const d = r.result; for (const [n, k] of Object.entries(STORES)) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, {keyPath: k}); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
    } catch { this.db = null; }
  },
  _all(s){ if (!this.db) return Promise.resolve([...this.mem[s].values()]); return new Promise((res, rej) => { const q = this.db.transaction(s).objectStore(s).getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  _get(s, k){ if (!this.db) return Promise.resolve(this.mem[s].get(k)); return new Promise((res, rej) => { const q = this.db.transaction(s).objectStore(s).get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  _put(s, items){ if (!this.db){ items.forEach(i => this.mem[s].set(i[STORES[s]], i)); return Promise.resolve(); } return new Promise((res, rej) => { const t = this.db.transaction(s, 'readwrite'); const st = t.objectStore(s); items.forEach(i => st.put(i)); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  del(s, keys){ keys = [].concat(keys); if (!this.db){ keys.forEach(k => this.mem[s].delete(k)); return Promise.resolve(); } return new Promise((res, rej) => { const t = this.db.transaction(s, 'readwrite'); const st = t.objectStore(s); keys.forEach(k => st.delete(k)); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  clear(s){ if (!this.db){ this.mem[s].clear(); return Promise.resolve(); } return new Promise((res, rej) => { const t = this.db.transaction(s, 'readwrite'); t.objectStore(s).clear(); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async all(s){ const rows = await this._all(s); return Promise.all(rows.map(r => this._dec(r))); },
  async get(s, k){ const r = await this._get(s, k); return r ? this._dec(r) : undefined; },
  async put(s, items){ items = [].concat(items); const kp = STORES[s]; const rows = await Promise.all(items.map(async i => { const {iv, c} = await aesEnc(Vault.key, te.encode(JSON.stringify(i))); return {[kp]: i[kp], iv, c}; })); return this._put(s, rows); },
  async _dec(r){ return JSON.parse(td.decode(await aesDec(Vault.key, r.iv, r.c))); },
  async kvGet(k){ const r = await this._get('kv', k); return r ? r.v : undefined; },
  kvSet(k, v){ return this._put('kv', [{k, v}]); }
};

/* ---------- trạng thái ---------- */
const S = { stories: [], chapters: new Map(), progress: new Map(), mode: 'title', q: '', filter: 'all' };

/* ---------- Bảng thay từ: hiển thị từ dễ đọc thay cho từ gốc, nội dung gốc không đổi ---------- */
const GLOBAL_ID = '__bang-thay-tu-chung__';
const globalRec = () => S.stories.find(s => s.id === GLOBAL_ID);
const termsOf = id => (id === GLOBAL_ID ? globalRec() : S.stories.find(s => s.id === id))?.terms || [];
async function setTerms(id, terms){
  const clean = []; const seen = new Set();
  for (const t of terms){ const from = String(t.from || '').trim(), to = String(t.to ?? '').trim(); if (!from || seen.has(from)) continue; seen.add(from); clean.push({from, to}); }
  if (id === GLOBAL_ID && !globalRec()) await saveStory({id: GLOBAL_ID, system: true, title: 'Bảng thay từ chung', terms: clean, deleted: false});
  else await saveStory({id, terms: clean});
  await loadAll(); TermCache.clear();
}
const TermCache = new Map();
function termRegex(storyId){
  if (TermCache.has(storyId)) return TermCache.get(storyId);
  const m = new Map(); for (const t of termsOf(GLOBAL_ID)) m.set(t.from, t.to); for (const t of termsOf(storyId)) m.set(t.from, t.to);
  let out = null;
  if (m.size){
    const keys = [...m.keys()].sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    try { out = {re: new RegExp(`(?<![\\p{L}\\p{N}])(?:${keys.join('|')})(?![\\p{L}\\p{N}])`, 'gu'), m}; }
    catch { out = {re: new RegExp(keys.join('|'), 'g'), m}; }
  }
  TermCache.set(storyId, out); return out;
}
const applyTerms = (text, storyId) => { const r = termRegex(storyId); return r ? String(text).replace(r.re, k => r.m.get(k)) : text; };
const parseTermLines = txt => String(txt || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^(.+?)\s*(?:=>|→|->|=|\t|:)\s*(.*)$/); return m ? {from: m[1].trim(), to: m[2].trim()} : null; }).filter(Boolean);
const chaptersOf = id => S.chapters.get(id) || [];
async function loadAll(){
  const [st, ch, pr] = await Promise.all([DB.all('stories'), DB.all('chapters'), DB.all('progress')]);
  S.stories = st; S.chapters = new Map();
  for (const c of ch){ if (c.deleted) continue; if (!S.chapters.has(c.storyId)) S.chapters.set(c.storyId, []); S.chapters.get(c.storyId).push(c); }
  for (const a of S.chapters.values()) a.sort((x, y) => x.order - y.order);
  S.progress = new Map(pr.filter(p => !p.deleted).map(p => [p.storyId, p]));
}
function progressOf(story){
  const list = chaptersOf(story.id), p = S.progress.get(story.id);
  if (!p || !list.length) return {idx: -1, pct: 0, count: list.length, p: null};
  let idx = list.findIndex(c => c.id === p.chapterId); if (idx < 0) idx = 0;
  const pct = Math.min(100, Math.round(((idx + (p.ratio || 0)) / list.length) * 100));
  return {idx, pct, count: list.length, p, done: idx === list.length - 1 && (p.ratio || 0) > .95};
}

/* ---------- xử lý văn bản & Word ---------- */
const NUM = '(?:\\d+|[ivxlcdm]+|một|hai|ba|bốn|năm|sáu|bảy|tám|chín|mười)';
const HEAD_RE = new RegExp('^(?:chương|chuong|chapter|chap\\.?|hồi|quyển|phần|tập)\\s*' + NUM + '(?=$|[\\s:.\\-–—,)])', 'iu');
const SPECIAL_RE = /^(?:ngoại truyện|phiên ngoại|vĩ thanh|lời mở đầu|mở đầu|tiết tử|lời kết|đoạn kết|phần kết)(?:\s*\d+)?\s*(?:[:.\-–—]\s*.{0,60})?$/iu;
const isHeading = l => { l = l.trim().replace(/^[^\p{L}\p{N}]+/u, ''); return !!l && l.length <= 120 && (HEAD_RE.test(l) || SPECIAL_RE.test(l)); };
const cleanText = t => String(t || '').replace(/\r\n?/g, '\n').split('\n').map(s => s.replace(/[\s ]+/g, ' ').trim()).filter(Boolean).join('\n');
function linesToChapters(items, split, fallbackTitle, dropShortPre){
  // items: [{text, h}] — h = dòng tiêu đề (Heading trong Word)
  items = items.filter(i => i.text);
  if (!items.length) return [];
  const whole = () => [{title: fallbackTitle || 'Chương 1', content: items.map(i => i.text).join('\n')}];
  if (!split) return whole();
  const useH = items.some(i => i.h);
  const out = []; const pre = []; let cur = null;
  for (const it of items){
    if ((useH && it.h) || isHeading(it.text)){
      if (cur && !cur.body.length && fold(cur.title) === fold(it.text)) continue; // tiêu đề lặp 2 lần liền nhau
      cur = {title: it.text, body: []}; out.push(cur);
    }
    else if (cur) cur.body.push(it.text); else pre.push(it.text);
  }
  if (!out.length) return whole();
  // Vài dòng ngắn trước tiêu đề chương (tên truyện, tên web…) khi dán từ web thì bỏ
  const preIsJunk = dropShortPre && pre.length <= 4 && pre.every(l => l.length <= 80);
  if (pre.length && !preIsJunk) out.unshift({title: 'Mở đầu', body: pre});
  return out.filter(c => c.body.length).map(c => ({title: c.title, content: c.body.join('\n')}));
}
/* Dọn chữ thừa khi copy cả trang web: nút điều hướng, bình luận, quảng cáo, đường dẫn… Chỉ bỏ dòng ngắn khớp nguyên dòng. */
const JUNK = [
  /^(?:chương|chap|chapter)\s*(?:trước|sau|tiếp(?:\s*theo)?|kế(?:\s*tiếp)?)\b.*$/iu,
  /^(?:mục lục|danh sách chương|chọn chương|bình luận.*|báo (?:lỗi|cáo).*|theo dõi.*|bỏ theo dõi|đánh dấu.*|cài đặt|cấu hình|tuỳ chỉnh|tùy chỉnh|đăng nhập|đăng ký|đăng xuất|trang chủ|quảng cáo|advertisement|ads|tải app.*|tải ứng dụng.*|chia sẻ.*|share|like|tweet|thích|đề cử.*|tặng quà.*|ủng hộ.*|donate.*|previous|next|prev|top|lên đầu trang|về đầu trang|xem thêm|xem tiếp|đọc tiếp|loading.*|đang tải.*|close|đóng|menu|tìm kiếm.*|search|thể loại.*|tác giả\s*:.*|trạng thái\s*:.*|nghe truyện.*|audio)$/iu,
  /^(?:lượt (?:xem|đọc|thích)|cập nhật(?: lúc)?|đăng lúc|ngày đăng|số chữ|views?)\b.*$/iu,
  /^https?:\/\/\S+$/i,
  /^(?:www\.)?[\w-]+(?:\.[\w-]+)*\.(?:com|net|org|vn|info|me|io|xyz|club|site|top|online|pro|cc|tv)(?:\/\S*)?$/i,
  /^(?:nguồn|source|copyright|©)\b.{0,100}$/iu,
  /^[^\n]{0,60}\s[>›»]\s[^\n]{0,60}\s[>›»]\s.*$/u,
  /^[\d\s\p{P}\p{S}]+$/u
];
const SCENE_BREAK = /^(?:[*\-~=•·o.]\s*){3,}$/u;
const ON_SITE = /(?:bạn đang đọc|đọc truyện|truyện được đăng|truyện chỉ được đăng).{0,120}(?:tại|trên)\s+\S+\.\S+/iu;
// Cụm nút điều hướng (thường có cả ở trên và dưới phần truyện) và các mốc bắt đầu phần bình luận
const NAV = /^[<‹«←\s]*(?:mục lục|danh sách chương|chương\s*(?:trước|sau|tiếp(?:\s*theo)?|kế(?:\s*tiếp)?)|trước|sau|tiếp)[\s>›»→]*$/iu;
const TAIL = /^(?:báo lỗi|cảm ơn|bình luận(?:\s*\(\d+\))?|hướng dẫn nhanh cho người mới đọc|xếp theo|gửi bình luận|viết bình luận|để lại bình luận|bình luận facebook|truyện cùng tác giả|truyện liên quan|có thể bạn thích)$/iu;
const EXTRA_JUNK = [/^(?:bn|aa|a\+|a-|\+|−)$/i, /^[▶►▸•]\s*\S/u, /^[【\[].{0,200}[】\]]$/u, /(?:\s\|\s.*){2,}/u];
function cleanWeb(text){
  const lines = cleanText(text).split('\n'); const removed = [];
  // 1) Giữ phần nằm giữa cụm điều hướng đầu tiên và cụm cuối cùng
  let start = 0, end = lines.length;
  const groups = [];
  lines.forEach((l, i) => { if (NAV.test(l)){ const g = groups[groups.length - 1]; if (g && i - g.e <= 3) g.e = i; else groups.push({s: i, e: i}); } });
  if (groups.length >= 2 && groups[groups.length - 1].s - groups[0].e > 3){ start = groups[0].e + 1; end = groups[groups.length - 1].s; }
  else if (groups.length){ const g = groups[0]; if (g.e < lines.length / 2) start = g.e + 1; else end = g.s; }
  // 2) Cắt từ mốc phần bình luận trở xuống
  for (let i = start + 3; i < end; i++) if (TAIL.test(lines[i])){ end = i; break; }
  removed.push(...lines.slice(0, start), ...lines.slice(end));
  // 3) Lọc từng dòng thừa còn sót bên trong
  const kept = lines.slice(start, end).filter(l => {
    if (SCENE_BREAK.test(l)) return true;
    if ((l.length <= 120 && (JUNK.some(r => r.test(l)) || EXTRA_JUNK.some(r => r.test(l)))) || (l.length <= 250 && ON_SITE.test(l))){ removed.push(l); return false; }
    return true;
  });
  return {text: kept.join('\n'), removed};
}
// Dán MỘT chương từ web: tìm tên chương ở mấy dòng đầu, bỏ các dòng ngắn phía trên nó (tên truyện, tác giả…)
const stripLead = l => l.replace(/^[^\p{L}\p{N}]+/u, '');
const CHAP_RE = new RegExp('^(?:chương|chuong|chapter|chap\\.?|hồi)\\s*' + NUM + '(?=$|[\\s:.\\-–—,)])', 'iu');
const VOL_RE = /^(?:quyển|tập|volume|vol\.)\s*\S/iu;
const isChap = l => l.length <= 120 && CHAP_RE.test(stripLead(l));
function parseOneChapter(raw, clean, storyTitle){
  const r = clean ? cleanWeb(raw) : {text: cleanText(raw), removed: []};
  let lines = r.text.split('\n').filter(Boolean); let title = '';
  // Có dòng “Chương …”: bỏ hết phía trên (trừ dòng “Quyển/Tập …”), chọn dòng “Chương” có nhiều nội dung nhất ngay sau nó
  const cand = clean ? lines.map((l, i) => isChap(l) ? i : -1).filter(i => i >= 0) : [];
  if (cand.length){
    let best = cand[0], bestScore = -1;
    cand.forEach((ci, j) => { const nx = j + 1 < cand.length ? cand[j + 1] : lines.length; const sc = lines.slice(ci + 1, nx).reduce((n, l) => n + l.length, 0); if (sc > bestScore){ bestScore = sc; best = ci; } });
    const above = lines.slice(0, best);
    const vols = above.filter(l => l.length <= 120 && VOL_RE.test(stripLead(l)));
    const keep = vols.length ? [vols[vols.length - 1]] : [];
    above.forEach(l => { if (!keep.includes(l)) r.removed.push(l); });
    title = stripLead(lines[best]); title = title.charAt(0).toUpperCase() + title.slice(1);
    let body = lines.slice(best + 1);
    while (body.length && fold(stripLead(body[0])) === fold(title)) r.removed.push(body.shift());
    for (let j = body.length - 1; j >= 0; j--) if (isChap(body[j]) && body.slice(j + 1).join('').length < 200) r.removed.push(...body.splice(j));
    return {title, content: keep.concat(body).join('\n'), removed: r.removed};
  }
  const k = lines.slice(0, 8).findIndex(isHeading);
  if (k >= 0 && lines.slice(0, k).every(l => l.length <= 80)){
    r.removed.push(...lines.slice(0, k)); title = lines[k]; lines = lines.slice(k + 1);
    while (lines.length && fold(lines[0]) === fold(title)) r.removed.push(lines.shift()); // tên chương lặp lại
  }
  else if (storyTitle && lines.length && fold(lines[0]) === fold(storyTitle)){ r.removed.push(lines.shift()); }
  return {title, content: lines.join('\n'), removed: r.removed};
}
const textToChapters = (text, split, fb, clean) => {
  const t = clean ? cleanWeb(text).text : cleanText(text);
  return linesToChapters(t.split('\n').map(x => ({text: x})), split, fb, !!clean);
};
let mammothP = null;
function ensureMammoth(){
  if (window.mammoth) return Promise.resolve();
  if (!mammothP) mammothP = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = MAMMOTH_URL; s.onload = () => res();
    s.onerror = () => { mammothP = null; rej(new Error('Chưa tải được bộ đọc tệp Word. Hãy kết nối mạng một lần rồi thử lại.')); };
    document.head.appendChild(s);
  });
  return mammothP;
}
async function docxItems(file){
  await ensureMammoth();
  const {value} = await window.mammoth.convertToHtml({arrayBuffer: await file.arrayBuffer()});
  const doc = new DOMParser().parseFromString(value, 'text/html');
  return $$('h1,h2,h3,h4,p,li', doc.body).map(el => ({h: /^H[1-3]$/.test(el.tagName), text: el.textContent.replace(/[\s ]+/g, ' ').trim()}));
}
// Đọc phần đầu tệp Word do Tủ truyện xuất ra: tên truyện, “Tác giả:”, “Tag:”, “Ghi chú:”
function extractMeta(items){
  const META = /^(tác giả|tag|ghi chú)\s*:\s*(.*)$/i; const head = items.slice(0, 6);
  if (!head.some(i => META.test(i.text))) return null;
  const meta = {}; let titleIdx = -1;
  head.forEach((it, i) => { const m = it.text.match(META); if (m){ const k = fold(m[1]); if (k === 'tac gia') meta.author = m[2].trim(); else if (k === 'tag') meta.tags = parseTags(m[2]); else meta.note = m[2].trim(); it._meta = true; } else if (titleIdx < 0 && !meta.author && !meta.tags) titleIdx = i; });
  if (titleIdx >= 0){ meta.title = head[titleIdx].text; head[titleIdx]._meta = true; }
  for (let i = items.length - 1; i >= 0; i--) if (items[i]._meta) items.splice(i, 1);
  return meta;
}
async function filesToChapters(files, split){
  const sorted = [...files].sort((a, b) => a.name.localeCompare(b.name, 'vi', {numeric: true}));
  let all = [], meta = null;
  for (const f of sorted){
    if (!/\.docx$/i.test(f.name)) throw new Error(`“${f.name}” không phải tệp .docx. Nếu là .doc cũ, hãy mở bằng Word và lưu lại dưới dạng .docx.`);
    const items = await docxItems(f); const m = extractMeta(items); if (m && !meta) meta = m;
    all = all.concat(linesToChapters(items, split, f.name.replace(/\.docx$/i, '')));
  }
  return {chapters: all, meta};
}

let afterChange = () => {};
async function saveStory(data){
  const t = Date.now(); const old = data.id ? S.stories.find(s => s.id === data.id) : null;
  const s = old ? {...old, ...data, updatedAt: t} : {id: uid(), createdAt: t, deleted: false, ...data, updatedAt: t};
  await DB.put('stories', s); afterChange('lib'); return s;
}
async function addChapters(storyId, list){
  // lấy thứ tự lớn nhất ngay trong bộ nhớ máy (không dựa vào danh sách đang hiển thị, có thể đã cũ)
  const ex = (await DB.all('chapters')).filter(c => c.storyId === storyId && !c.deleted);
  let order = ex.reduce((m, c) => Math.max(m, c.order || 0), 0) + 1; const t = Date.now();
  const metas = [], texts = [];
  list.forEach((c, i) => { const id = uid(); metas.push({id, storyId, order: order + i, title: c.title, len: c.content.length, updatedAt: t, deleted: false}); texts.push({id, content: c.content}); });
  await DB.put('texts', texts); await DB.put('chapters', metas); afterChange('lib');
}

  if (j < 0 || j >= list.length) return false; const t = Date.now();

async function trashStory(id){ const s = S.stories.find(x => x.id === id); await DB.put('stories', {...s, trashed: true, trashedAt: Date.now(), updatedAt: Date.now()}); afterChange('lib'); }
async function restoreStory(id){ const s = S.stories.find(x => x.id === id); await DB.put('stories', {...s, trashed: false, updatedAt: Date.now()}); afterChange('lib'); }
async function deleteStory(id){
  const t = Date.now(); const s = S.stories.find(x => x.id === id);
  await DB.put('stories', {...s, deleted: true, updatedAt: t});

async function snapshot(){

  const tm = new Map(texts.map(t => [t.id, t.content]));

function mergeRecords(localArr, remoteArr, key){
  const L = new Map(localArr.map(r => [r[key], r])), R = new Map(remoteArr.map(r => [r[key], r]));
  const out = new Map(L), toLocal = []; let remoteBehind = false;
  for (const [k, r] of R){ const l = L.get(k); if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)){ out.set(k, r); toLocal.push(r); } }
  for (const [k, l] of L){ const r = R.get(k); if (!r || (l.updatedAt || 0) > (r.updatedAt || 0)) remoteBehind = true; }
  return {merged: [...out.values()], toLocal, remoteBehind};
}
async function applyRecords({stories = [], chapters = [], progress = []}){
  if (stories.length) await DB.put('stories', stories);
  if (chapters.length){
    const metas = chapters.map(({content, ...m}) => m);
    const texts = chapters.filter(c => !c.deleted).map(c => ({id: c.id, content: c.content || ''}));
    if (texts.length) await DB.put('texts', texts);
    const dead = chapters.filter(c => c.deleted).map(c => c.id); if (dead.length) await DB.del('texts', dead);
    await DB.put('chapters', metas);
  }
  if (progress.length) await DB.put('progress', progress);
}

/* ---------- khoá ứng dụng ---------- */
async function createLock(kind, pass){
  const salt = rand(16), raw = rand(32); const pk = await pbkdf2(pass, salt, ITER); const w = await aesEnc(pk, raw);
  const lock = {kind, salt: b64(salt), iter: ITER, iv: b64(w.iv), wrapped: b64(w.c), createdAt: Date.now()};
  await DB.kvSet('lock', lock); Vault.key = await importAes(raw); raw.fill(0); return lock;
}
async function unwrap(pass){
  const lock = await DB.kvGet('lock'); if (!lock) return null;
  try { const pk = await pbkdf2(pass, unb64(lock.salt), lock.iter); return await aesDec(pk, unb64(lock.iv), unb64(lock.wrapped)); } catch { return null; }
}
async function deriveSyncKey(pass){ const a = Auth.info; Vault.syncKey = a ? await pbkdf2(pass, te.encode('tu-truyen-sync|' + a.email.toLowerCase()), ITER) : null; if (Lock.remember) await rememberKeys(); }
/* “Không khoá”: khoá giải mã được cất trong trình duyệt của máy này dưới dạng không xuất ra được; dữ liệu vẫn mã hoá. */
async function rememberKeys(){ await DB.kvSet('remember', {key: Vault.key, sync: Vault.syncKey || null}); Lock.remember = true; }
async function forgetKeys(){ await DB.del('kv', 'remember'); Lock.remember = false; }
async function changeLock(oldp, kind, newp){
  const raw = await unwrap(oldp); if (!raw) return false;
  const salt = rand(16); const pk = await pbkdf2(newp, salt, ITER); const w = await aesEnc(pk, raw); raw.fill(0);
  await DB.kvSet('lock', {kind, salt: b64(salt), iter: ITER, iv: b64(w.iv), wrapped: b64(w.c), createdAt: Date.now()});

}

function drawContinue(){
  const el = $('#cont'); if (!el) return;
  const withP = live().map(s => ({s, p: S.progress.get(s.id)})).filter(x => x.p && chaptersOf(x.s.id).length).sort((a, b) => b.p.updatedAt - a.p.updatedAt);

function matches(s){
  const q = fold(S.q); if (!q) return true;
  if (S.mode === 'all') return fold(s.title).includes(q) || fold(s.author).includes(q) || (s.tags || []).some(t => fold(t).includes(q));
  if (S.mode === 'title') return fold(s.title).includes(q);
  if (S.mode === 'author') return fold(s.author).includes(q);
  return (s.tags || []).some(t => fold(t).includes(q));
}
function drawShelf(){
  const shelf = $('#shelf'); if (!shelf) return;

    const counts = new Map(); live().forEach(s => (s.tags || []).forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
    const qf = fold(S.q); const tags = [...counts].filter(([t]) => !qf || fold(t).includes(qf)).sort((a, b) => a[0].localeCompare(b[0], 'vi'));
    $('#tagcloud').innerHTML = tags.length ? tags.map(([t, n]) => `<button class="tag" data-tagpick="${esc(t)}" aria-pressed="${fold(t) === qf}">${esc(t)} <span class="muted">${n}</span></button>`).join('') : `<span class="muted small">Chưa có tag nào khớp.</span>`;
  } else $('#tagcloud').innerHTML = '';

    return `<li><button class="row" data-open="${s.id}"><span class="r-t">${esc(s.title)} ${statusPill(s)}</span>${s.author ? `<span class="r-a">${esc(s.author)}</span>` : ''}${(s.tags || []).length ? `<span class="r-g">${s.tags.map(esc).join(' · ')}</span>` : ''}<span class="r-p num"><span class="bar"><i style="width:${pr.done ? 100 : pr.pct}%"></i></span>${prog}</span></button></li>`;
  }).join('');
}

const MEDIA = 'img,picture,svg,video,audio,iframe,canvas,object,embed,figure,script,style,noscript';
function htmlToTextNoImages(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll(MEDIA).forEach(n => n.remove());
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:-99999px;top:0;width:800px;white-space:normal';
  box.innerHTML = doc.body.innerHTML; document.body.appendChild(box);
  const t = box.innerText; box.remove(); return t;
}
document.addEventListener('paste', e => {
  const ta = e.target.closest?.('textarea.field'); if (!ta) return;
  const html = e.clipboardData?.getData('text/html');
  if (!html || !/<(?:img|picture|svg|video|iframe|figure|canvas)\b/i.test(html)) return; // không có hình thì dán bình thường
  e.preventDefault();
  ta.setRangeText(htmlToTextNoImages(html), ta.selectionStart, ta.selectionEnd, 'end');
  ta.dispatchEvent(new Event('input', {bubbles: true}));
});

    if (b.dataset.editT != null){ const t = termsOf(id).find(x => x.from === b.dataset.editT); const r = await termModal(t.from, t.to); if (!r) return; await setTerms(id, termsOf(id).filter(x => x.from !== t.from && x.from !== r.from).concat({from: r.from, to: r.to})); return TermsView({id}); }
    const a = b.dataset.act;
    if (a === 'back') return history.length > 1 ? history.back() : go('library');
    if (a === 'global') return go('terms', {id: GLOBAL_ID});

    if (a === 'copyall'){ $('#t-lines').value = termsOf(id).map(t => `${t.from} = ${t.to}`).join('\n'); $('#t-lines').select(); return; }

    }

}

/* ---------- Thêm chương nhanh (dán từng chương từ web) ---------- */
function wireQuickAdd(storyId, count){
  const box = $('#qa'); if (!box) return;
  const ta = $('#qa-text'), ti = $('#qa-title'), pv = $('#qa-prev'), cl = $('#qa-clean'), save = $('#qa-save');
  let parsed = [], removed = [], titleTouched = false;
  box.addEventListener('toggle', () => { LS.set('qaOpen', box.open); const s = box.querySelector('summary span'); if (s) s.textContent = `dán từ web · bấm để ${box.open ? 'thu gọn' : 'mở'}`; });
  const fallback = () => `Chương ${count + 1}`;
  const storyTitle = S.stories.find(x => x.id === storyId)?.title;
  const update = () => {
    const raw = ta.value; if (!raw.trim()){ parsed = []; pv.textContent = 'Hình ảnh được tự bỏ, chữ giữ nguyên để bạn tự sửa. Lưu xong ô dán trống sẵn cho chương tiếp theo.'; return; }
    // Giữ nguyên toàn bộ chữ; chỉ gợi ý tên chương từ dòng “Chương …” đầu tiên
    let lines = cleanText(raw).split('\n'); const h = lines.slice(0, 40).find(l => isChap(l) || isHeading(l)) || '';
    let t = stripLead(h); t = t ? t.charAt(0).toUpperCase() + t.slice(1) : '';
    if (!titleTouched) ti.value = t;
    if (t && lines.length && fold(stripLead(lines[0])) === fold(t)) lines = lines.slice(1); // dòng đầu chính là tên chương
    parsed = lines.length ? [{title: ti.value.trim() || fallback(), content: lines.join('\n')}] : [];
    const c = parsed[0]?.content || ''; const firstL = c.split('\n')[0], lastL = c.split('\n').slice(-1)[0];
    pv.innerHTML = `Sẽ thêm <b>${esc(ti.value.trim() || fallback())}</b> · ${c.length.toLocaleString('vi-VN')} ký tự<br><span class="small">Dòng đầu: “${esc(firstL.slice(0, 80))}${firstL.length > 80 ? '…' : ''}”<br>Dòng cuối: “${esc(lastL.slice(0, 80))}${lastL.length > 80 ? '…' : ''}”</span><br><span class="small muted">Bạn có thể xoá bớt chữ thừa ngay trong ô dán trước khi lưu, hoặc sửa sau bằng nút Sửa của chương.</span>`;
  };
  ta.addEventListener('input', debounce(update, 250)); cl.onchange = update; ta.addEventListener('paste', () => setTimeout(update, 0));
  ti.addEventListener('input', () => { titleTouched = true; update(); });
  save.onclick = async () => {
    update(); if (!parsed.length) return toast('Chưa có nội dung để lưu.');
    const list = parsed.length === 1 ? [{title: ti.value.trim() || parsed[0].title, content: parsed[0].content}] : parsed;
    save.disabled = true;
    await addChapters(storyId, list); await loadAll();
    toast(list.length === 1 ? `Đã lưu “${list[0].title}”` : `Đã lưu ${list.length} chương`);
    current.params = {id: storyId, _scroll: scrollY}; render();
    setTimeout(() => $('#qa-text')?.focus({preventScroll: true}), 50);
  };
}

function sourceBlock(prefix){

    <input type="checkbox" id="${prefix}-clean" hidden>
    <div class="preview" id="${prefix}-prev"><span class="muted">Xem trước các chương sẽ hiện ở đây.</span></div>
  </fieldset>`;
}
function wireSource(root, prefix, fallbackTitle){
  const st = {src: 'paste', files: [], chapters: [], busy: false};
  const prev = $(`#${prefix}-prev`, root), text = $(`#${prefix}-text`, root), file = $(`#${prefix}-file`, root), split = $(`#${prefix}-split`, root), drop = $(`#${prefix}-drop`, root), clean = $(`#${prefix}-clean`, root);
  const show = () => {
    const c = st.chapters;
    prev.innerHTML = st.busy ? 'Đang đọc tệp…' : !c.length ? '<span class="muted">Chưa có nội dung.</span>' :
      `<b>${c.length} chương</b> · ${c.reduce((n, x) => n + x.content.length, 0).toLocaleString('vi-VN')} ký tự${removedHtml(st.removed)}<ol>${c.slice(0, 60).map(x => `<li>${esc(x.title)} <span class="muted small">(${x.content.length.toLocaleString('vi-VN')} ký tự)</span></li>`).join('')}${c.length > 60 ? `<li class="muted">… và ${c.length - 60} chương nữa</li>` : ''}</ol>`;
  };
  const recompute = async () => {
    st.removed = [];
    try {
      if (st.src === 'paste'){ if (clean.checked) st.removed = cleanWeb(text.value).removed; st.chapters = textToChapters(text.value, split.checked, fallbackTitle(), clean.checked); }
      else if (st.files.length){ st.busy = true; show(); const r = await filesToChapters(st.files, split.checked); st.chapters = r.chapters; if (r.meta) st.onMeta?.(r.meta); }
      else st.chapters = [];
    } catch (e){ st.chapters = []; toast(e.message, 5000); }
    st.busy = false; show();
  };
  const setFiles = fs => { st.files = [...fs]; $(`#${prefix}-files`, root).textContent = st.files.map(f => f.name).join(', '); st.onFiles?.(st.files); recompute(); };
  $$('[data-src]', root).forEach(b => b.onclick = () => { st.src = b.dataset.src; $$('[data-src]', root).forEach(x => x.setAttribute('aria-pressed', x === b)); $$('[data-pane]', root).forEach(p => p.hidden = p.dataset.pane !== st.src); if (st.src === 'docx') ensureMammoth().catch(() => {}); recompute(); });
  text.addEventListener('input', debounce(recompute, 300));
  split.onchange = recompute; clean.onchange = recompute;
  file.onchange = () => setFiles(file.files);
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); setFiles(e.dataTransfer.files); });
  st.recompute = recompute;
  return st;
}
const removedHtml = rm => rm && rm.length ? ` · <details style="display:inline"><summary class="link" style="display:inline;cursor:pointer">đã bỏ ${rm.length} dòng thừa</summary><ul class="small muted" style="margin:.3em 0;padding-left:1.2em;max-height:8em;overflow:auto">${rm.slice(0, 80).map(l => `<li>${esc(l)}</li>`).join('')}</ul></details>` : '';
const parseTags = s => [...new Set(String(s || '').split(/[,;#\n]/).map(t => t.trim()).filter(Boolean))];

/* ---------- Trình đọc ---------- */
const Prefs = {
  d: {mode: 'system', size: 20, lh: 1.75, width: 'normal', justify: false, autoLock: 1, flow: 'scroll'},

const Reader = {

      <article class="r-body"><div class="r-cols"><p class="r-kicker" id="r-k"></p><h2 id="r-h"></h2><div class="r-text" id="r-x"></div><span class="r-end" aria-hidden="true"></span></div></article>

      document.body.appendChild(this.el);

      this.el.addEventListener('click', e => this.onClick(e));
      this.el.addEventListener('scroll', () => this.onScroll(), {passive: true});

      this.body.addEventListener('touchend', e => {
        if (!this.paged || this.tx == null) return; const t = e.changedTouches[0]; const dx = t.clientX - this.tx, dy = t.clientY - this.ty; this.tx = null;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ this.swiped = Date.now(); this.turn(dx < 0 ? 1 : -1); }
      }, {passive: true});
      document.addEventListener('keydown', this.onKey = e => {
        if (!this.el || $('.scrim') || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
        if (e.key === 'ArrowRight' || (this.paged && (e.key === 'PageDown' || e.key === ' '))){ e.preventDefault(); this.paged ? this.turn(1) : this.step(1); }
        if (e.key === 'ArrowLeft' || (this.paged && e.key === 'PageUp')){ e.preventDefault(); this.paged ? this.turn(-1) : this.step(-1); }

      });

  /* Lật trang: nội dung chương xếp thành các cột rộng đúng một màn hình, mỗi lần lật dịch đúng một cột */
  layout(ratio){

    const cs = getComputedStyle(b); const cw = b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight); const gap = 36;
    cols.style.cssText = `height:${b.clientHeight - parseFloat(cs.paddingTop)}px;column-width:${cw}px;column-gap:${gap}px;column-fill:auto;transform:none`;

/* ---------- Đồng bộ Google Drive (appDataFolder, dữ liệu đã mã hoá) ---------- */
function mergeDevices(a, b){
  const m = new Map();
  for (const d of [...a, ...b]){
    const o = m.get(d.id); if (!o){ m.set(d.id, {...d}); continue; }
    const n = {...o}; for (const k of ['loginAt', 'lastSeen', 'revokedAt', 'removedAt', 'signedOutAt']) n[k] = Math.max(o[k] || 0, d[k] || 0);
    if ((d.nameAt || 0) > (o.nameAt || 0)){ n.name = d.name; n.nameAt = d.nameAt; }
    n.os = d.os || o.os; n.br = d.br || o.br; m.set(d.id, n);
  }
  return [...m.values()];
}
function devStatus(d){ const L = d.loginAt || 0; if ((d.removedAt || 0) > L) return 'removed'; if ((d.signedOutAt || 0) > L) return 'out'; if ((d.revokedAt || 0) > L) return 'pending'; return 'active'; }

      <label class="check" style="text-align:left"><input type="checkbox" id="st-r" checked> Không hỏi mã khi mở trên máy này (truyện vẫn được mã hoá)</label>
      <button class="btn primary big" type="submit">Tạo thư viện</button><p class="err" id="st-e" role="alert"></p>
      <p class="hint">Hãy ghi nhớ mã khoá. Nếu đã có thư viện trên máy khác, dùng đúng mã khoá đó để đồng bộ được.</p></form>`;
    $$('[data-k]', el).forEach(b => b.onclick = () => { kind = b.dataset.k; $$('[data-k]', el).forEach(x => x.setAttribute('aria-pressed', x === b)); ['#st-1', '#st-2'].forEach(s => $(s).inputMode = kind === 'pin' ? 'numeric' : 'text'); $('#st-h').textContent = passRule(kind); });
    $('#st').onsubmit = async e => {
      e.preventDefault(); const a = $('#st-1').value, b = $('#st-2').value, er = $('#st-e');
      if (!validPass(kind, a)) return er.textContent = passRule(kind);
      if (a !== b) return er.textContent = 'Hai lần nhập không khớp.';
      er.textContent = 'Đang tạo…'; await createLock(kind, a); if ($('#st-r').checked) await rememberKeys(); await seedSample(); this.unlocked();
    };
  },
  async unlocked(){
    const el = $('#lock'); el.hidden = true; el.innerHTML = '';
    await loadAll(); await ensureLongSample().catch(() => {});
    current = {view: 'library', params: {}}; try { history.replaceState({view: 'library', params: {}}, ''); } catch {}
    render();
  },
  lock(){
    if (current.view === 'reader') Reader.close();
    $$('.scrim').forEach(x => x.remove());
    Vault.key = null; Vault.syncKey = null; S.stories = []; S.chapters = new Map(); S.progress = new Map();
    this.show();
  }
};
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden'){
    Lock.hiddenAt = Date.now();
    if (Vault.key && Reader.el) Reader.save();
    if (Vault.key && Vault.syncKey && Auth.token() && (LS.get('dirtyLib') || LS.get('dirtyState'))) Sync.run({quiet: true}).catch(() => {});
    if (Vault.key && !Lock.remember && Prefs.get().autoLock === 0) Lock.lock();
  } else {
    if (Vault.key && !Lock.remember && Lock.hiddenAt && Date.now() - Lock.hiddenAt >= Prefs.get().autoLock * 60000) Lock.lock();
    else if (Vault.key && Vault.syncKey && Auth.token()) Sync.run({quiet: true}).catch(() => {});
  }
});

/* ---------- Truyện mẫu (sáng tác riêng cho bản thử) ---------- */
async function seedSample(){
  if (live().length || LS.get('seeded', false)) return; LS.set('seeded', true);
  const s = await saveStory({title: 'Ngọn đèn ở mũi Đá Trắng', author: 'Truyện mẫu', tags: ['mẫu', 'truyện ngắn'], note: 'Truyện mẫu để thử các tính năng. Có thể xoá trong “Sửa thông tin”.'});
  await addChapters(s.id, textToChapters(`Chương 1: Người gác đèn
Ông Tư gác ngọn đèn ở mũi Đá Trắng đã hai mươi năm. Mỗi chiều, khi nắng vừa ngả sang màu đồng, ông leo một trăm mười hai bậc thang xoắn, lau kính, châm dầu và ngồi đợi trời tối.
Ngọn đèn không cần ông nhìn mới sáng. Nhưng ông vẫn nhìn, như người ta vẫn nhìn bếp lửa dù biết nó chẳng tắt.
Dưới chân mũi đá là làng chài nhỏ. Từ trên cao, mái nhà trông như những viên sỏi xám ai đó rải dọc bờ cát.
Đêm nào có thuyền ra khơi, ông đếm. Sáng nào thuyền về, ông đếm lại. Hai con số bằng nhau thì ông mới đi ngủ.
Chương 2: Con thuyền lạc
Đêm mười bốn tháng Chạp, gió mùa thổi rát mặt. Mười một chiếc ra khơi, đến gần sáng mới về mười.
Ông Tư cầm ống nhòm quét mặt biển từng khoảng một. Sương dày đến mức ánh đèn chỉ đi được nửa đường đã bị nuốt mất.
Ông nhớ có lần cha ông nói: đèn không phải để thấy thuyền, mà để thuyền thấy mình. Ông bèn tháo tấm chắn phía bắc, để luồng sáng quét thấp xuống mặt nước.
Gần năm giờ, một đốm sáng nhỏ chớp lên ba lần ngoài xa. Ông chớp đèn đáp lại, rồi ngồi xuống bậc thang, tay vẫn còn run.
Chương 3: Buổi sáng
Chiếc thuyền thứ mười một cập bến khi mặt trời vừa nhô khỏi biển. Người lái là cậu Bảy, mười chín tuổi, lần đầu tự đi một mình.
Cậu leo lên tận đỉnh đèn, đặt xuống bàn một con cá thu còn quẫy. Ông Tư không nói gì, chỉ rót cho cậu một chén trà.
Từ hôm ấy, mỗi chiều có thêm một người leo một trăm mười hai bậc thang. Ngọn đèn vẫn sáng như cũ, nhưng người ngồi đếm thuyền thì đã là hai.`, true));
  await addChapters(s.id, LONG_SAMPLE());
  LS.set('seeded2', true); LS.set('dirtyLib', false); LS.set('dirtyState', false);
}
// Chương mẫu dài (tự viết) để thử cuộn dọc và lật trang; thêm vào truyện mẫu cũ nếu còn thiếu
async function ensureLongSample(){
  if (LS.get('seeded2', false)) return; LS.set('seeded2', true);
  const s = live().find(x => x.author === 'Truyện mẫu' && x.title === 'Ngọn đèn ở mũi Đá Trắng');
  if (s && chaptersOf(s.id).length < 4){ await addChapters(s.id, LONG_SAMPLE()); await loadAll(); }
}

  '“Mây vàng mỡ gà là gió lên,” ông nói. “Mây xám chì mà thấp là mưa tới. Còn mây trắng mà kéo thành vệt dài như vây cá thì mai đừng cho thuyền nhỏ ra.”',
  'Cậu Bảy chép từng câu vào một cuốn vở học trò bìa xanh. Chữ cậu to và nghiêng, mỗi trang chỉ được chừng mười dòng. Ông Tư nhìn qua vai cậu, không nói gì, nhưng tối hôm ấy ông lục trong rương ra một cuốn sổ cũ hơn, giấy đã ngả vàng, đưa cho cậu.',

].join('\n')}];

/* ---------- khởi động ---------- */
async function boot(){
  Prefs.apply();
  afterChange = kind => Sync.schedule(kind);
  if (!window.crypto?.subtle){ $('#lock').hidden = false; $('#lock').innerHTML = '<div class="lock-box"><h1>Tủ truyện</h1><p>Trình duyệt này không hỗ trợ mã hoá. Hãy mở bằng Chrome, Safari, Edge hoặc Firefox bản mới qua địa chỉ https.</p></div>'; return; }
  await DB.open();
  if (HOSTED && Auth.clientId()) Auth.gis().catch(() => {});
  if (HOSTED && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (HOSTED) ensureMammoth().catch(() => {});
  try { history.replaceState({view: 'library', params: {}}, ''); } catch {}
  const rem = await DB.kvGet('remember').catch(() => null);
  if (rem?.key && await DB.kvGet('lock')){
    Lock.remember = true; Vault.key = rem.key; Vault.syncKey = rem.sync || null;
    await Lock.unlocked();
    if (HOSTED && Auth.info && Vault.syncKey && Auth.token()) Sync.run({quiet: true}).catch(() => {});
    return;
  }
  Lock.show();
}
boot();
})();
